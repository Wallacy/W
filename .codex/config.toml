# Sol owns language design. Luna applies frozen bundles.
model = "gpt-5.6-sol"
model_reasoning_effort = "high"

[agents]
enabled = true
max_concurrent_threads_per_session = 1
default_subagent_model = "gpt-5.6-luna"
default_subagent_reasoning_effort = "max"

# Sol selects Multi-Agent V2 through model metadata. These settings keep child
# routing fields visible and use the namespace required by the current runtime.
[features.multi_agent_v2]
hide_spawn_agent_metadata = false
tool_namespace = "agents"
