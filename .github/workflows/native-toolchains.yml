name: Native toolchain validation

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Choose the native toolchain lane to validate.
        required: true
        type: choice
        options:
          - linux
          - windows
          - both
        default: linux

permissions:
  contents: read

concurrency:
  group: native-toolchain-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-linux:
    name: Native Linux runner
    if: ${{ inputs.platform == 'linux' || inputs.platform == 'both' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install the archive decompressor
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends zstd

      - name: Test acquisition and native runner barriers
        run: bun test tooling/acquire-mlir0-ci-linux.test.mjs tooling/check-w-run.test.mjs

      - name: Acquire and verify the pinned Linux MLIR toolchain
        timeout-minutes: 15
        run: bun tooling/acquire-mlir0-ci-linux.mjs --download

      - name: Run the manual native Linux gate
        timeout-minutes: 10
        run: bun tooling/command-runner.mjs --command check:w-run -- --ci

  native-windows:
    name: Native Windows runner
    if: ${{ inputs.platform == 'windows' || inputs.platform == 'both' }}
    runs-on: windows-2025
    timeout-minutes: 35

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Acquire the pinned Windows MLIR0 toolchain
        timeout-minutes: 15
        run: bun tooling/command-runner.mjs --command acquire:mlir0-windows

      - name: Run the manual native Windows gate
        timeout-minutes: 20
        run: bun tooling/command-runner.mjs --command check:w-run-windows -- --ci
