name: Build W LLVM target-pack bootstrap

on:
  workflow_dispatch:
    inputs:
      llvm_tag:
        description: Exact stable official llvmorg-X.Y.Z tag
        required: true
        type: string
      expected_commit:
        description: Full upstream Git commit ID resolved from that tag
        required: true
        type: string
      expected_source_sha256:
        description: SHA-256 of `git archive --format=tar <commit>` from llvm-project
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: w-llvm-target-pack-bootstrap
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.host }} development pack
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: linux-x86_64
            runner: ubuntu-24.04
          - host: windows-x86_64
            runner: windows-2025
          - host: macos-arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360

    steps:
      - name: Check out W workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Build, smoke-test, and package the pinned upstream source
        id: pack
        env:
          W_LLVM_TAG: ${{ inputs.llvm_tag }}
          W_LLVM_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          W_LLVM_EXPECTED_SOURCE_SHA256: ${{ inputs.expected_source_sha256 }}
        run: bun tooling/llvm-target-pack.mjs build --host "${{ matrix.host }}"

      - name: Upload development pack and archive digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: w-llvm-development-${{ inputs.llvm_tag }}-${{ matrix.host }}
          path: |
            ${{ steps.pack.outputs.archive-path }}
            ${{ steps.pack.outputs.archive-sha256-path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
