name: Build W LLVM target-pack bootstrap

on:
  workflow_dispatch:
    inputs:
      llvm_tag:
        description: Exact stable official llvmorg-X.Y.Z tag
        required: true
        type: string
      expected_commit:
        description: Full upstream Git commit ID resolved from that tag
        required: true
        type: string
      expected_source_sha256:
        description: SHA-256 of `git archive --format=tar <commit>` from llvm-project
        required: true
        type: string
      host:
        description: Build one host pack per dispatch to bound runner use.
        required: true
        type: choice
        options:
          - linux-x86_64
          - windows-x86_64
          - macos-arm64
        default: linux-x86_64

permissions:
  contents: read

concurrency:
  group: w-llvm-target-pack-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-host:
    name: Validate selected host
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject unsupported host
        env:
          W_LLVM_HOST: ${{ inputs.host }}
        run: |
          case "$W_LLVM_HOST" in
            linux-x86_64|windows-x86_64|macos-arm64) ;;
            *) echo "Unsupported LLVM pack host: $W_LLVM_HOST" >&2; exit 2 ;;
          esac

  build:
    name: ${{ inputs.host }} development pack
    needs: validate-host
    runs-on: ${{ inputs.host == 'linux-x86_64' && 'ubuntu-24.04' || inputs.host == 'windows-x86_64' && 'windows-2025' || 'macos-15' }}
    timeout-minutes: 240

    steps:
      - name: Check out W workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Build, smoke-test, and package the pinned upstream source
        id: pack
        timeout-minutes: 225
        env:
          W_LLVM_TAG: ${{ inputs.llvm_tag }}
          W_LLVM_EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          W_LLVM_EXPECTED_SOURCE_SHA256: ${{ inputs.expected_source_sha256 }}
        run: bun tooling/llvm-target-pack.mjs build --host "${{ inputs.host }}"

      - name: Upload development pack and archive digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        timeout-minutes: 10
        with:
          name: w-llvm-development-${{ inputs.llvm_tag }}-${{ inputs.host }}
          path: |
            ${{ steps.pack.outputs.archive-path }}
            ${{ steps.pack.outputs.archive-sha256-path }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
