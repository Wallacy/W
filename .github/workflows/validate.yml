name: Validate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Integrated check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install locked tooling
        run: bun ci --cwd tooling/tree-sitter-w

      - name: Run the integrated check
        run: bun run check

      - name: Verify generated files
        run: git diff --exit-code

  native-linux:
    name: Native Linux runner
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install the archive decompressor
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends zstd

      - name: Test acquisition and native runner barriers
        run: bun test tooling/acquire-mlir0-ci-linux.test.mjs tooling/check-w-run.test.mjs

      - name: Acquire and verify the pinned Linux MLIR toolchain
        run: bun tooling/acquire-mlir0-ci-linux.mjs --download

      - name: Run the mandatory native Linux gate
        run: bun run check:w-run --ci

  native-windows:
    name: Native Windows runner
    runs-on: windows-2025
    timeout-minutes: 35

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0

      - name: Acquire the pinned Windows MLIR0 toolchain
        run: bun run acquire:mlir0-windows

      - name: Run the mandatory native Windows gate
        run: bun run check:w-run-windows --ci
